name: Android APK

# Builds a debug APK you can download from the run page (Actions -> this run -> Artifacts)
# and install on any Android phone. Run it manually or it runs on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: pitchside-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
